<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>World Monitor | 設定移行</title>
  <link rel="stylesheet" href="migration.css">
  <script src="vendor/lucide.min.js" defer></script>
  <script type="module" src="migration.js"></script>
</head>
<body>
  <header><a href="/" title="ダッシュボード"><i data-lucide="arrow-left"></i><span>WORLD MONITOR</span></a><span>設定移行</span></header>
  <main>
    <h1>設定移行</h1>
    <section aria-labelledby="currentTitle">
      <h2 id="currentTitle">このブラウザー</h2>
      <dl id="currentSettings"></dl>
      <button id="exportSettings"><i data-lucide="download"></i>設定を書き出す</button>
    </section>
    <section aria-labelledby="importTitle">
      <h2 id="importTitle">設定ファイル</h2>
      <div class="file-control">
        <label for="settingsFile"><i data-lucide="upload"></i>JSONを選ぶ</label><span id="fileName">未選択</span>
        <input id="settingsFile" class="visually-hidden" type="file" accept=".json,application/json" aria-label="移行する設定ファイル">
      </div>
      <dl id="importPreview"></dl>
      <button id="applySettings" disabled><i data-lucide="check"></i>設定を適用</button>
    </section>
    <p id="result" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
